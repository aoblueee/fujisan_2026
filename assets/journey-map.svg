<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">三島から富士山へ、旅のエリアマップ</title>
<desc id="map-desc">北を上にした概略図。南東の三島駅から北西の富士宮口五合目へバスで往復。両地点は直線で約30キロ。五合目から富士宮口山頂までの登山道は片道約4.3キロ。頂上富士館に泊まり、翌朝は剣ヶ峰へ。山頂付近を拡大しており縮尺は一定ではありません。</desc>
